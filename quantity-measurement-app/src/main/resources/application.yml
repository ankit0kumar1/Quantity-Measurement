server:
  port: 8082

spring:
  application:
    name: quantity-measurement-app

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/quantity_db
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT (same secret as security-service for token validation)
jwt:
  secret: U3ByaW5nU2VjdXJpdHlKd3RTZWNyZXRLZXkxMjM0NTY=
  expiration: 86400000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html