server:
  port: 8081

spring:
  application:
    name: security-service

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/security_db
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # GitHub OAuth2
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23lits5KjCPEIli04L
            client-secret: 4cc6d760b2cf4e3960823766751f50f431cb7a81
            scope: user:email

# JWT Config
jwt:
  secret: U3ByaW5nU2VjdXJpdHlKd3RTZWNyZXRLZXkxMjM0NTY=
  expiration: 86400000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info